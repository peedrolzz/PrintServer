{{define "content"}}
<h1>Teste de impressão</h1>
{{if .Message}}<div class="msg ok">{{.Message}}</div>{{end}}
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
{{if not .Printers}}
<p>Nenhuma impressora USB.</p>
{{else}}
<ul class="list">
  {{range .Printers}}
  <li>
    <form method="post" action="/test-print" class="action-row">
      <input type="hidden" name="_csrf" value="{{$.CSRF}}">
      <input type="hidden" name="serial" value="{{.SerialNumber}}">
      <span>{{.Name}}</span>
      <button class="btn primary" type="submit">Imprimir</button>
    </form>
  </li>
  {{end}}
</ul>
{{end}}
{{end}}

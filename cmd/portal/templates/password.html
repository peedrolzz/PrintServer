{{define "content"}}
<h1>Senhas</h1>
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
{{if .Message}}<div class="msg ok">{{.Message}}</div>{{end}}

<h2>Painel</h2>
<form method="post" action="/password" autocomplete="off">
  <div class="field">
    <label for="current">Atual</label>
    <input id="current" name="current" type="password" required autofocus autocomplete="current-password">
  </div>
  <div class="field">
    <label for="new">Nova</label>
    <input id="new" name="new" type="password" required minlength="8" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="confirm">Repetir nova</label>
    <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
  </div>
  <button class="btn primary" type="submit">Salvar senha do painel</button>
</form>

<h2>WiFi do equipamento</h2>
<p>Ao salvar, o hotspot reinicia. O celular precisa entrar na rede com a nova senha.</p>
<form method="post" action="/password/wifi" autocomplete="off">
  <div class="field">
    <label for="wifi-current">Senha atual do WiFi</label>
    <input id="wifi-current" name="current" type="password" required autocomplete="current-password">
  </div>
  <div class="field">
    <label for="wifi-new">Nova senha do WiFi</label>
    <input id="wifi-new" name="new" type="password" required minlength="8" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="wifi-confirm">Repetir nova senha do WiFi</label>
    <input id="wifi-confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
  </div>
  <button class="btn primary" type="submit">Salvar senha do WiFi</button>
</form>
{{end}}

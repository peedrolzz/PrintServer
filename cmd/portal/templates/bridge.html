{{define "content"}}
<h1>Impressão</h1>
{{if .Message}}<div class="msg ok">{{.Message}}</div>{{end}}
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}

<div class="choice">
  <div>
    <strong>Com token</strong>
    <p>Só o PDV cadastrado imprime.</p>
  </div>
  {{if .BridgeOpen}}
  <form method="post" action="/bridge">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="mode" value="auth">
    <button class="btn primary" type="submit">Ativar</button>
  </form>
  {{else}}<span class="badge ok">ativo</span>{{end}}
</div>

<div class="choice">
  <div>
    <strong>Aberta</strong>
    <p>Qualquer máquina da rede imprime.</p>
  </div>
  {{if .BridgeOpen}}<span class="badge warn">ativo</span>{{else}}
  <form method="post" action="/bridge" onsubmit="return confirm('Liberar impressão para toda a rede?')">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="mode" value="open">
    <button class="btn danger" type="submit">Ativar</button>
  </form>
  {{end}}
</div>

{{end}}

{{define "content"}}
<h1>Escolha uma senha</h1>
<p>Troque a senha inicial <span class="mono">printserver</span> antes de usar o painel. Mínimo de 8 caracteres.</p>
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
<form method="post" action="/first-run" autocomplete="off">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <div class="field">
    <label for="new">Senha nova</label>
    <input id="new" name="new" type="password" required minlength="8" autofocus autocomplete="new-password">
  </div>
  <div class="field">
    <label for="confirm">Repetir senha nova</label>
    <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
  </div>
  <button class="btn primary" type="submit">Salvar</button>
</form>
<p class="hint">A senha do WiFi do equipamento continua <span class="mono">printserver</span> até você trocar na página de WiFi.</p>
{{end}}
